<div class="d-flex gap-3 w-100">
  <div class="d-flex gap-3 flex-wrap align-content-start" style="width: 75%">
    @for (item of cardConstants; track $index; let i = $index) {
      <app-kpi-card
        class="kpi-card"
        [kpiData]="item"
        [index]="i"
      ></app-kpi-card>
    }
  </div>

  <div
    class="d-flex flex-column gap-2 primary-background-color rounded-4 p-4 shadow-sm h-100"
    style="width: 25%"
  >
    <div>
      <h1 class="m-0 white-text fw-semibold">$9.470</h1>
      <p class="m-0 fs-smaller" style="color: #ffded7">Active Balance</p>
    </div>
    <div class="d-flex align-items-center justify-content-between my-2">
      <div class="d-flex align-items-center gap-2">
        <span class="material-symbols-outlined white-text">
          arrow_circle_up
        </span>
        <p class="white-text fs-smaller m-0">Incomes</p>
      </div>
      <p class="white-text fs-smaller m-0">+$196,098</p>
    </div>
    <div class="d-flex align-items-center justify-content-between my-2">
      <div class="d-flex align-items-center gap-2">
        <span class="material-symbols-outlined white-text">
          arrow_circle_down
        </span>
        <p class="white-text fs-smaller m-0">Expenses</p>
      </div>
      <p class="white-text fs-smaller m-0">-$6,098</p>
    </div>
    <div class="d-flex align-items-center justify-content-between my-2">
      <div class="d-flex align-items-center gap-2">
        <span class="material-symbols-outlined white-text">
          arrow_circle_down
        </span>
        <p class="white-text fs-smaller m-0">Taxes</p>
      </div>
      <p class="white-text fs-smaller m-0">-$6,098</p>
    </div>

    <button
      class="rounded-4 border-0 bg-white primary-color w-100 p-2 fw-medium"
    >
      Add Virtual Card
    </button>
  </div>
</div>
